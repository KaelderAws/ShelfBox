<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ShelfBox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Сайдбар -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h7"/>
      </svg>
      <span class="brand-text">ShelfBox</span>
    </div>

    <button id="open-add-modal-btn" class="primary-btn add-btn">
      <span>Добавить медиа</span>
    </button>

    <div class="nav-group">
      <div class="nav-header">Разделы</div>
      <button class="nav-item active" id="tab-catalog-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Каталог</span>
      </button>
      <button class="nav-item" id="tab-tags-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        <span>Теги</span>
      </button>
    </div>

    <div class="nav-group" id="media-types-filter">
      <div class="nav-header">Тип медиа</div>
      <button class="nav-item active" data-type="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Все</span>
      </button>
      <button class="nav-item" data-type="game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.3 5H6.7A4 4 0 0 0 2.7 8.6L2 15a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.4-1.4A2 2 0 0 1 9.8 15h4.4a2 2 0 0 1 1.4.6L17 17c.5.5 1 1 2 1a3 3 0 0 0 3-3l-.7-6.4A4 4 0 0 0 17.3 5z"/></svg>
        <span>Игры</span>
      </button>
      <button class="nav-item" data-type="movie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
        <span>Фильмы</span>
      </button>
      <button class="nav-item" data-type="series">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
        <span>Сериалы</span>
      </button>
      <button class="nav-item" data-type="anime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/><path d="M5 3v4M3 5h4M19 17v4M17 19h4"/></svg>
        <span>Аниме</span>
      </button>
      <button class="nav-item" data-type="book">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Книги</span>
      </button>
      <button class="nav-item" data-type="comics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
        <span>Комиксы</span>
      </button>
      <button class="nav-item" data-type="manga">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M14 2v7l-2.5-1.5L9 9V2"/></svg>
        <span>Манга</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-header">Быстрый доступ</div>
      <button class="nav-item" id="filter-favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Избранное</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-title-row">
        <span class="nav-header">Подборки</span>
        <button type="button" id="new-collection-btn" title="Создать подборку">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="collections-list" class="collections-list"></div>
    </div>
  </aside>

  <!-- Рабочая область -->
  <div class="main-wrapper">
    <!-- Каталог -->
    <section id="view-catalog" class="view-panel active">
      <header class="top-bar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Поиск по названию, тегам, описанию...">
        </div>

        <div class="controls-group">
          <label class="inline-label">Тег:</label>
          <select id="tag-filter-select">
            <option value="">Все теги</option>
          </select>
        </div>

        <div class="controls-group">
          <label class="inline-label">Сортировка:</label>
          <select id="sort-select">
            <option value="date-desc">Сначала новые</option>
            <option value="date-asc">Сначала старые</option>
            <option value="rating-desc">Оценка: по убыванию</option>
            <option value="rating-asc">Оценка: по возрастанию</option>
            <option value="title-asc">По названию (А-Я)</option>
            <option value="title-desc">По названию (Я-А)</option>
          </select>
        </div>

        <!-- Переключатель Сетка / Список -->
        <div class="view-mode-toggle">
          <button type="button" id="view-mode-grid" class="view-mode-btn active" title="Сетка">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
          <button type="button" id="view-mode-list" class="view-mode-btn" title="Список">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </header>

      <main id="catalog" class="catalog-grid view-grid"></main>
    </section>

    <!-- Полноценная страница проекта -->
    <section id="view-detail" class="view-panel">
      <header class="detail-header-bar">
        <button type="button" id="detail-back-btn" class="secondary-btn detail-back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>Назад в каталог</span>
        </button>
        <div class="detail-top-actions">
          <button type="button" id="detail-fav-btn" class="heart-badge-btn" title="В избранное">
            <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </button>
          <button type="button" id="detail-edit-btn" class="secondary-btn">Редактировать</button>
          <button type="button" id="detail-delete-btn" class="secondary-btn delete-btn">Удалить</button>
        </div>
      </header>

      <main class="detail-content-wrap">
        <div class="detail-card-shell">
          <div class="detail-cover-col">
            <div id="detail-cover-container" class="detail-cover-box"></div>
          </div>
          <div class="detail-info-col">
            <h1 id="detail-title">Cyberpunk 2077</h1>

            <div class="detail-meta-pills">
              <span id="detail-type-pill" class="badge meta-pill-badge"></span>
              <span id="detail-status-pill" class="badge meta-pill-badge"></span>
              <div id="detail-rating-pill" class="detail-rating-wrap"></div>
            </div>

            <div class="detail-section">
              <span class="detail-sec-label">Теги</span>
              <div id="detail-tags-list" class="tags"></div>
            </div>

            <div class="detail-section">
              <span class="detail-sec-label">Подборки</span>
              <div id="detail-collections-list" class="tags"></div>
            </div>

            <div class="detail-section">
              <span class="detail-sec-label">Описание</span>
              <p id="detail-description" class="detail-text-content"></p>
            </div>

            <div class="detail-section">
              <span class="detail-sec-label">Заметки</span>
              <div id="detail-notes" class="detail-notes-card"></div>
            </div>

            <div class="detail-section">
              <span class="detail-sec-label">История статусов</span>
              <div id="detail-status-history" class="status-history-timeline"></div>
            </div>
          </div>
        </div>
      </main>
    </section>

    <!-- Менеджер тегов -->
    <section id="view-tags" class="view-panel">
      <header class="tags-header">
        <h2>Управление тегами</h2>
        <div class="tags-header-controls">
          <input type="text" id="tags-search-input" class="tags-search-bar" placeholder="🔍 Поиск среди тегов...">
          <form id="tag-create-form" class="tag-create-form">
            <input type="text" id="new-tag-name" required placeholder="Название нового тега">
            <button type="submit" class="primary-btn">Создать тег</button>
          </form>
        </div>
      </header>

      <div class="tags-manager-container">
        <table class="tags-table">
          <thead>
            <tr>
              <th>Название тега</th>
              <th>Использование</th>
              <th style="text-align: right;">Действия</th>
            </tr>
          </thead>
          <tbody id="tags-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Модалка медиа -->
  <div id="media-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-heading">Новая запись</h2>
        <button type="button" class="close-btn" id="close-media-modal-x">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="media-form">
        <input type="hidden" id="edit-item-id">
        <div class="form-layout">
          <div class="drop-zone-container">
            <div id="drop-zone" class="drop-zone">
              <img id="cover-preview" class="cover-preview hidden" />
              <div id="drop-placeholder" class="drop-placeholder">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>Перетащите обложку сюда</p>
                <small>или выберите файл с диска</small>
              </div>
            </div>
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <button type="button" id="browse-btn" class="secondary-btn small-btn">Выбрать файл</button>
          </div>

          <div class="fields-container">
            <!-- Строка 1: Название и Избранное -->
            <div class="form-row title-fav-row">
              <div class="field-title-wrap">
                <label for="title">Название <span class="required-star">*</span></label>
                <input type="text" id="title" placeholder="Введите название...">
              </div>
              <div class="field-fav-wrap">
                <button type="button" id="fav-heart-btn" class="heart-toggle-btn" title="В избранное">
                  <svg viewBox="0 0 24 24" class="heart-icon">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Строка 2: Тип медиа, Статус и Оценка -->
            <div class="form-row meta-triplet-row">
              <div class="meta-col">
                <label for="media_type">Тип медиа</label>
                <select id="media_type" class="modal-select">
                  <option value="game">Игра</option>
                  <option value="movie">Фильм</option>
                  <option value="series">Сериал</option>
                  <option value="anime">Аниме</option>
                  <option value="book">Книга</option>
                  <option value="comics">Комиксы</option>
                  <option value="manga">Манга</option>
                </select>
              </div>
              <div class="meta-col">
                <label for="status">Статус</label>
                <select id="status" class="modal-select">
                  <option value="Запланировано">Запланировано</option>
                  <option value="В процессе">В процессе</option>
                  <option value="Завершено">Завершено</option>
                  <option value="Брошено">Брошено</option>
                </select>
              </div>
              <div class="meta-col rating-col">
                <label>Оценка</label>
                <div class="star-rating-widget" id="star-picker">
                  <div class="stars-track" id="stars-track"></div>
                  <span id="star-score-label" class="star-score-label">Нет оценки</span>
                  <button type="button" id="clear-rating-btn" class="clear-star-btn" title="Сбросить оценку">✕</button>
                </div>
              </div>
            </div>

            <!-- Строка 3: Теги и Подборки в 2 колонки -->
            <div class="form-row tags-collections-row">
              <div class="half-col">
                <label>Выбрать теги</label>
                <div id="modal-tags-picker" class="tags-picker"></div>
              </div>
              <div class="half-col">
                <label>Добавить в подборки</label>
                <div id="modal-collections-picker" class="collections-picker"></div>
              </div>
            </div>

            <!-- Строка 4: Описание / Синопсис -->
            <div class="field-block">
              <label for="description">Описание / Синопсис</label>
              <textarea id="description" rows="2" placeholder="Краткий сюжет, синопсис или аннотация..."></textarea>
            </div>

            <!-- Строка 5: Личные комментарии -->
            <div class="field-block">
              <label for="notes">Личные комментарии</label>
              <textarea id="notes" rows="2" placeholder="Личные мысли, впечатления, заметки..."></textarea>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="close-media-modal-btn" class="secondary-btn">Отмена</button>
          <button type="submit" class="primary-btn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модалка подборки -->
  <div id="collection-modal" class="modal hidden">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Новая подборка</h2>
        <button type="button" class="close-btn" id="close-col-modal-x">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="collection-form">
        <label>Название подборки</label>
        <input type="text" id="new-col-input">
        <div class="modal-actions">
          <button type="button" id="close-col-modal-btn" class="secondary-btn">Отмена</button>
          <button type="submit" class="primary-btn">Создать</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модалка редактирования тега -->
  <div id="edit-tag-modal" class="modal hidden">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Переименовать тег</h2>
        <button type="button" class="close-btn" id="close-edit-tag-modal-x">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="edit-tag-form">
        <input type="hidden" id="edit-tag-id">
        <label>Новое имя тега</label>
        <input type="text" id="edit-tag-name-input" required placeholder="Название тега">
        <div class="modal-actions">
          <button type="button" id="close-edit-tag-modal-btn" class="secondary-btn">Отмена</button>
          <button type="submit" class="primary-btn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
